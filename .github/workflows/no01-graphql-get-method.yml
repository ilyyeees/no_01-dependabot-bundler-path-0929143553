name: no01 GraphQL GET method probe

on:
  push:
    branches:
      - no01-graphql-get-method

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Send a no-op mutation operation over GET
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          status=$(curl --silent --show-error --get \
            --output response.json \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --data-urlencode 'query=mutation Noop { __typename }' \
            https://api.github.com/graphql)
          printf 'HTTP_STATUS=%s\n' "$status"
          jq -c . response.json
          if jq -e '.data.__typename == "Mutation"' response.json >/dev/null; then
            printf 'PROBE_RESULT=GET_MUTATION_ACCEPTED\n'
            exit 73
          fi
          if jq -e '.errors | type == "array" and length > 0' response.json >/dev/null; then
            printf 'PROBE_RESULT=GET_MUTATION_REJECTED\n'
            exit 0
          fi
          printf 'PROBE_RESULT=UNEXPECTED_RESPONSE\n'
          exit 2
