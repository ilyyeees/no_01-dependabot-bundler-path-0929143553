name: no 01 Maven proof

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/no_01-maven-proof.yml

permissions:
  actions: read
  contents: write

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preserve only Maven proxy decision lines
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          : > no_01-maven-github-proof.txt
          for run_id in 36616645655 36616889220; do
            work="run-${run_id}"
            mkdir -p "${work}/logs"
            curl --fail --silent --show-error --location \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/logs" \
              --output "${work}/logs.zip"
            unzip -q "${work}/logs.zip" -d "${work}/logs"
            printf 'RUN %s\n' "$run_id" >> no_01-maven-github-proof.txt
            find "${work}/logs/Dependabot" -type f -name '*Run Dependabot.txt' -print0 \
              | xargs -0 grep -a -E \
                'proxy \|.*(vjevx-89-37-63-107\.run\.pinggy-free\.link|authenticating maven repository request)' \
              | sed -E 's#^.*\.txt:##' \
              >> no_01-maven-github-proof.txt
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add no_01-maven-github-proof.txt
          git commit -m 'Store sanitized Maven proxy proof [skip ci]'
          git push
