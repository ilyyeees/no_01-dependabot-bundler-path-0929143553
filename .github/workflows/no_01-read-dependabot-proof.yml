name: no 01 read Dependabot proof

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/no_01-read-dependabot-proof.yml
      - github-api-probe/no_01_proof_public.pem

permissions:
  actions: read
  contents: write

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Store an encrypted diagnostic excerpt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PROBE_RUN_ID: "36613951052"
        run: |
          set -euo pipefail
          mkdir logs
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${PROBE_RUN_ID}/logs" \
            --output logs.zip
          unzip -q logs.zip -d logs
          grep -R -a -i -E \
            'updater \||proxy \||NO_01_|github-api-probe|gradle|lockfile|write-locks|failure|failed|exception|error|command' \
            logs > proof-lines.txt || true
          head -c 262144 proof-lines.txt | gzip -9 > proof-excerpt.gz
          split -b 190 -d -a 5 proof-excerpt.gz proof-chunk-
          : > no_01-proof.rsa
          for chunk in proof-chunk-*; do
            openssl pkeyutl -encrypt \
              -pubin \
              -inkey github-api-probe/no_01_proof_public.pem \
              -in "$chunk" \
              -pkeyopt rsa_padding_mode:oaep \
              -pkeyopt rsa_oaep_md:sha256 \
              -pkeyopt rsa_mgf1_md:sha256 \
              -out "$chunk.enc"
            base64 -w 0 "$chunk.enc" >> no_01-proof.rsa
            printf '\n' >> no_01-proof.rsa
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add no_01-proof.rsa
          git commit -m 'Store encrypted Dependabot proof excerpt [skip ci]'
          git push
